<div class="forgot-password-container">
  <div class="forgot-card">
    <div class="header-section">
      <h2>Account Recovery</h2>
      <p class="subtitle">Securely regain access to your EWOMS portal</p>
    </div>

    <div *ngIf="successMessage" class="success-alert">
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label>Registered Email</label>
        <input type="email" formControlName="email" placeholder="name@ewoms.com" autocomplete="email">
      </div>
      
      <button type="submit" class="btn-submit clickable" [disabled]="isLoading">
        {{ isLoading ? 'Processing...' : 'Send Recovery Link' }}
      </button>

      <a routerLink="/login" class="back-link clickable">Return to Secure Sign-in</a>
    </form>
  </div>
</div>
