<div class="reset-password-container">
  <div class="reset-card">
    <h2>Reset Password</h2>
    <div *ngIf="successMessage" style="color: green; margin-bottom: 1rem;">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" style="color: red; margin-bottom: 1rem;">
      {{ errorMessage }}
    </div>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" formControlName="newPassword" placeholder="Enter new password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm new password">
      </div>
      <button type="submit" class="btn-reset" [disabled]="isLoading">
        {{ isLoading ? 'Resetting...' : 'Update Password' }}
      </button>
    </form>
  </div>
</div>
