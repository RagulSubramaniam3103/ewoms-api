<div class="security-root fade-in">
  <div class="security-header">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    </div>
    <div class="header-text">
      <h3>Account Security</h3>
      <p>Please update your credentials below.</p>
    </div>
  </div>

  <div class="security-body">
    <div *ngIf="successMessage" class="status-banner success">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
      Password updated successfully.
    </div>
    <div *ngIf="errorMessage" class="status-banner error">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="changeForm" (ngSubmit)="onSubmit()" class="security-form-layout">
      
      <div class="form-section">
        <label>Account Identity</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" formControlName="Email" placeholder="name@company.com">
        </div>
      </div>

      <div class="form-section">
        <label>Current Credentials</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input [type]="showOld ? 'text' : 'password'" formControlName="OldPassword" placeholder="Current Password">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-section">
          <label>New Password</label>
          <div class="input-with-icon">
            <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6zM18 20H6V10h12v10z"/></svg>
            <input [type]="showNew ? 'text' : 'password'" formControlName="Password" placeholder="Min. 6 characters">
          </div>
        </div>

        <div class="form-section">
          <label>Confirm Password</label>
          <div class="input-with-icon">
            <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6zM18 20H6V10h12v10z"/></svg>
            <input [type]="showConfirm ? 'text' : 'password'" formControlName="ConfirmPassword" placeholder="Repeat password">
          </div>
        </div>
      </div>

      <div class="btn-container">
        <button type="submit" class="premium-btn" [disabled]="isLoading || changeForm.invalid">
          <span *ngIf="!isLoading">Update Password</span>
          <span *ngIf="isLoading" class="loader-ring"></span>
        </button>
      </div>
    </form>
  </div>
</div>
