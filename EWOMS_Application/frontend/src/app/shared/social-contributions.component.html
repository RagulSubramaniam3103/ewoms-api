<div class="contributions-container fade-in">
  <!-- SKELETON LOADING -->
  <div class="skeleton-grid" *ngIf="isLoading && posts.length === 0">
    <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <!-- VIEW CONTROLS -->
  <div class="contributions-header-actions" *ngIf="posts.length > 0">
    <div class="view-toggle-group">
      <button [class.active]="viewType === 'grid'" (click)="viewType = 'grid'" title="Grid View">
        <i class="bi bi-grid-3x3"></i>
      </button>
      <button [class.active]="viewType === 'list'" (click)="viewType = 'list'" title="List View">
        <i class="bi bi-list-task"></i>
      </button>
    </div>
  </div>

  <!-- EMPTY STATE -->
  <div class="empty-contributions" *ngIf="!isLoading && posts.length === 0">
    <i class="bi bi-camera"></i>
    <p>No contributions yet.</p>
  </div>

  <!-- GRID VIEW -->
  <div class="contributions-grid" *ngIf="viewType === 'grid'">
    <div class="grid-item" *ngFor="let post of posts" (click)="openPostDetail(post)">
      <img [src]="'data:image/jpeg;base64,' + post.displayImage" alt="Contribution">
      <div class="grid-overlay">
        <div class="grid-stats">
          <span><i class="bi bi-heart-fill"></i> {{ post.likeCount }}</span>
          <span><i class="bi bi-chat-fill"></i> {{ post.commentCount }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div class="contributions-list" *ngIf="viewType === 'list'">
    <div class="contribution-card" *ngFor="let post of posts">
       <div class="card-visual">
         <img [src]="'data:image/jpeg;base64,' + post.displayImage">
       </div>
       <div class="card-info">
         <p class="caption">{{ post.caption }}</p>
         <div class="card-meta">
           <span>{{ post.createdAt | date:'MMM d' }}</span>
           <div class="mini-stats">
             <span><i class="bi bi-heart"></i> {{ post.likeCount }}</span>
             <span><i class="bi bi-chat"></i> {{ post.commentCount }}</span>
           </div>
         </div>
       </div>
    </div>
  </div>
</div>

<!-- POST DETAIL POPUP (IMMERSIVE) -->
<div class="post-detail-overlay" *ngIf="selectedPost" (click)="closePostDetail()">
  <div class="post-detail-card" (click)="$event.stopPropagation()">
    <button class="immersive-close-btn" (click)="closePostDetail()">
      <i class="bi bi-x-lg"></i>
    </button>
    <div class="detail-visual fade-in-zoom">
      <img [src]="'data:image/jpeg;base64,' + selectedPost.displayImage" alt="Zoomed Intelligence">
    </div>
  </div>
</div>
