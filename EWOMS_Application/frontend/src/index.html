<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EWOMS | Modern Enterprise</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Reset and Core Layout */
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Inter', 'Outfit', sans-serif;
      background-color: #f0f4f8; /* Matches --bg-primary in styles.css */
      color: #1a202c; /* Matches --text-primary */
    }

    /* Subtle Animated Background Elements */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(37, 99, 235, 0.05);
      filter: blur(80px);
      border-radius: 50%;
      animation: float 20s infinite alternate;
    }

    .blob-1 { top: -100px; right: -100px; animation-delay: 0s; }
    .blob-2 { bottom: -150px; left: -150px; background: rgba(59, 130, 246, 0.08); animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <app-root></app-root>
</body>
</html>
